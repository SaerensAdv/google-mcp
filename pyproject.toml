[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ads_mcp*", "gsc_mcp*", "ga4_mcp*", "psi_mcp*"]

[tool.uv]
package = true

[project]
name = "google-mcp"
version = "0.3.0"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "google-ads>=31.0.0",
    "mcp[cli]>=1.2.0",
    "fastmcp>=3.2.0",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.20.0",
    "google-auth-oauthlib>=1.0.0",
    "google-analytics-data>=0.18.0",
    "google-analytics-admin>=0.22.0",
    "httpx>=0.27.0",
]

description = "Unified MCP Server for Google Ads, Search Console, Analytics 4, and PageSpeed Insights."
readme = "README.md"
authors = [{ name = "Axel Saerens", email = "axel@saerensadvertising.com" }]
keywords = ["Google Ads", "Google Search Console", "Google Analytics", "PageSpeed", "MCP", "SEO"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python"
]

[project.optional-dependencies]
dev = [
    "black",
    "nox >=2025.5.1, <2026"
]

[project.urls]
homepage = "https://github.com/SaerensAdv/google-mcp"
repository = "https://github.com/SaerensAdv/google-mcp.git"
issues = "https://github.com/SaerensAdv/google-mcp/issues"

[project.scripts]
google-mcp = "ads_mcp.server:run_server"
google-ads-mcp = "ads_mcp.server:run_server"
